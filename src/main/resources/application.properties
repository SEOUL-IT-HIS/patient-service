spring.application.name=patient-service
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=lax
spring.datasource.url=jdbc:oracle:thin:@seoulit.pe.kr:1521/FREEPDB1
spring.datasource.username=patient
spring.datasource.password=patient
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.show-sql=true
# CORS 설정
app.cors.allowed-origin-patterns=*
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600
# Admin Service
admin-service.base-url=${ADMIN_SERVICE_BASE_URL:http://192.168.1.128:8080}